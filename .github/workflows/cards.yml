# Save this at: .github/workflows/cards.yml  (in the 1oNN/1oNN repo)
#
# Regenerates the profile card SVGs and commits them into this repo.
# scripts/make_cards.py needs no personal access token, it uses the automatic
# GITHUB_TOKEN that GitHub injects into every workflow run. The isocalendar step
# at the bottom is the one exception and reads the METRICS_TOKEN secret.

name: Profile cards

on:
  schedule:
    - cron: "0 3 * * *"   # refresh daily at 03:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/make_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg metrics-dark.svg \
                  metrics.languages.svg metrics.languages-dark.svg \
                  streak.svg streak-dark.svg
          if git diff --staged --quiet; then
            echo "Stats unchanged, nothing to commit."
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi

      # Last on purpose: this one commits through the API, so the step above
      # would be pushing a ref that does not contain it and the push would be
      # rejected. Replaces the github-readme-activity-graph embed, whose Vercel
      # deployment now answers 402 DEPLOYMENT_DISABLED.
      - name: Generate isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: refresh profile cards [skip ci]"
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/London
