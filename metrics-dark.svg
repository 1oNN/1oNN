<svg xmlns="http://www.w3.org/2000/svg" width="460" height="195" viewBox="0 0 460 195" role="img" aria-label="GitHub overview">
  <style>
    .t { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .title { font-size:14px; font-weight:600; fill:#6C8EBF; }
    .big { font-size:26px; font-weight:700; fill:#e6edf3; }
    .lbl { font-size:11px; font-weight:500; fill:#8b949e; letter-spacing:.3px; }
    .lang { font-size:12px; font-weight:500; fill:#e6edf3; }
    .pct { font-size:12px; font-weight:400; fill:#8b949e; }
    .date { font-size:10px; font-weight:400; fill:#8b949e; }
    .accent { fill:#6C8EBF; }
  </style>
  <rect x="0.5" y="0.5" width="459" height="194" rx="8"
        fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" class="t title">GitHub overview</text>
  <text x="24" y="56" class="t lbl">HAMMAD AHMAD</text>
  <text x="24" y="88" class="t big">6</text>
  <text x="24" y="106" class="t lbl">PUBLIC REPOS</text>
  <text x="244" y="88" class="t big">6</text>
  <text x="244" y="106" class="t lbl">TOTAL STARS</text>
  <text x="24" y="150" class="t big">4</text>
  <text x="24" y="168" class="t lbl">FOLLOWERS</text>
  <text x="244" y="150" class="t big">8</text>
  <text x="244" y="168" class="t lbl">LANGUAGES</text>
</svg>
